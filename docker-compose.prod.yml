services:
  mongo:
    image: mongo:7
    container_name: printlab3d-mongo-prod
    restart: always
    volumes:
      - mongo-data-prod:/data/db
    networks:
      - print3d-net
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\" | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: printlab3d-backend-prod
    restart: always
    depends_on:
      mongo:
        condition: service_healthy
    env_file:
      - ./print3d-backend/.env
    environment:
      NODE_ENV: production
      MONGO_URI: mongodb://mongo:27017/printlab3d
      PORT: 4000
    expose:
      - "4000"
    networks:
      - print3d-net
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: printlab3d-frontend-prod
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
    networks:
      - print3d-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

networks:
  print3d-net:
    driver: bridge

volumes:
  mongo-data-prod:
    driver: local
