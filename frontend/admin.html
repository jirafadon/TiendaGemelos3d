async function uploadProductImages(files){
  const selected=[...files].filter(file=>file?.type?.startsWith("image/")).slice(0,6);
  if(!selected.length) throw Error("Seleccioná al menos una imagen.");
  if(selected.some(file=>file.size>8*1024*1024)) throw Error("Cada imagen debe pesar menos de 8 MB.");
  const form=new FormData();
  selected.forEach(file=>form.append("images",file));
  const response=await fetch(API_URL+"/admin/upload-multiple",{method:"POST",headers:token()?{Authorization:`Bearer ${token()}`}: {},body:form});
  const data=await response.json().catch(()=>({}));
  if(!response.ok) throw Error(data.message||"Error al subir imágenes.");
  return data.urls||[];
}

function orderModal(id){const o=orders.find(x=>x.id===id);if(!o)return;openModal(`<div class="modal lg"><div class="modal-head"><div><h3>Pedido ${o.id}</h3><p>${date(o.created)}</p></div><button class="close"><i class="fa-solid fa-xmark"></i></button></div><div class="modal-body"><div class="detail"><div><div class="box"><h4>Cliente y dirección</h4><div class="line"><span>Cliente</span><strong>${esc(o.customer)}</strong></div><div class="line"><span>Email</span><strong>${esc(o.email)}</strong></div><div class="line"><span>Dirección</span><strong>${esc(o.address)}</strong></div></div><div class="box" style="margin-top:15px"><h4>Items</h4>${o.items.map(i=>`<div class="item"><img src="${img(i.seed)}"><div class="item-main"><strong>${esc(i.name)}</strong><small>${i.qty} × ${money(i.price)}</small></div><strong>${money(i.qty*i.price)}</strong></div>`).join("")}<div class="line"><span>Total</span><strong>${money(o.total)}</strong></div></div></div><div><div class="box"><h4>Estado</h4><div class="line"><span>Método</span><strong>${pay(o.payment)}</strong></div><div class="line"><span>Estado actual</span>${badge(o.status)}</div><select class="select" id="newStatus"><option value="pending">Pendiente</option><option value="paid">Pagado</option><option value="shipped">Enviado</option><option value="delivered">Entregado</option></select><button class="btn primary" style="width:100%;margin-top:8px" id="saveStatus">Guardar estado</button><button class="btn" style="width:100%;margin-top:8px" id="resend"><i class="fa-solid fa-envelope"></i>Reenviar email</button></div><div class="box" style="margin-top:15px"><h4>Historial</h4><div class="timeline">${o.history.map(h=>`<div class="event"><span class="dot"></span><strong>${({pending:"Pendiente",paid:"Pagado",shipped:"Enviado",delivered:"Entregado"})[h]||h}</strong><small>Estado registrado</small></div>`).join("")}</div></div></div></div></div><div class="modal-foot"><button class="btn" data-close>Cerrar</button></div></div>`);$("#newStatus").value=o.status;$("#saveStatus").onclick=()=>{changeOrder(id,$("#newStatus").value);closeModal();ordersView();dashboard()};$("#resend").onclick=async()=>{await tryApi(`/admin/orders/${id}/resend-email`,{method:"POST"});toast("success","Email reenviado","Se solicitó el email de confirmación.")}}
function changeOrder(id,s){const o=orders.find(x=>x.id===id);if(!o)return;o.status=s;o.history=[...(o.history||[]),s];save();tryApi(`/admin/orders/${id}/status`,{method:"PATCH",body:JSON.stringify({status:s})});toast("success","Estado actualizado",`${id}: ${s}`)}
function csv(){const head=["Número","Cliente","Email","Total","Método","Estado","Fecha"];const rows=orders.map(o=>[o.id,o.customer,o.email,o.total,pay(o.payment),o.status,o.created]);const q=v=>`"${String(v).replaceAll('"','""')}"`;const data="\uFEFF"+[head,...rows].map(r=>r.map(q).join(";")).join("\n");const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:"text/csv;charset=utf-8"}));a.download="tiendagemelos3d-pedidos.csv";a.click();toast("success","CSV exportado","Archivo generado correctamente.")}
function usersView(){const f=state.filters.user;let list=[...users];if(f.q){const q=f.q.toLowerCase();list=list.filter(u=>(u.name+u.email).toLowerCase().includes(q))}if(f.provider)list=list.filter(u=>u.provider===f.provider);if(f.role)list=list.filter(u=>u.role===f.role);if(f.blocked)list=list.filter(u=>f.blocked==="blocked"?u.blocked:!u.blocked);const p=state.pages.users;$("#usersView").innerHTML=`<div class="section"><div><h2>Usuarios</h2><p>Gestioná cuentas, roles y acceso.</p></div></div><div class="filters"><div class="search"><i class="fa-solid fa-magnifying-glass"></i><input class="input" id="uq" placeholder="Buscar nombre o email..." value="${esc(f.q)}"></div><select class="select" id="up"><option value="">Todos los proveedores</option><option value="email">Email</option><option value="google">Google</option></select><select class="select" id="ur"><option value="">Todos los roles</option><option value="user">Usuario</option><option value="admin">Administrador</option></select><select class="select" id="ub"><option value="">Todos</option><option value="active">Activos</option><option value="blocked">Bloqueados</option></select><button class="btn" id="uc">Limpiar</button></div><div class="card table-card"><div class="scroll"><table><thead><tr><th>Usuario</th><th>Proveedor</th><th>Rol</th><th>Estado</th><th>Registro</th><th>Acciones</th></tr></thead><tbody>${list.slice((p-1)*PAGE_SIZE,p*PAGE_SIZE).map(u=>`<tr><td><div class="product"><img class="avatar" src="${u.avatar}"><div><strong>${esc(u.name)}</strong><small>${esc(u.email)}</small></div></div></td><td>${u.provider==="google"?"Google":"Email"}</td><td><span class="badge ${u.role==="admin"?"b-blue":"b-gray"}">${u.role==="admin"?"Administrador":"Usuario"}</span></td><td><span class="badge ${u.blocked?"b-red":"b-green"}">${u.blocked?"Bloqueado":"Activo"}</span></td><td>${date(u.date)}</td><td><div class="actions"><button class="btn small" data-role="${u.id}" ${u.id===state.user.id?"disabled":""}>Rol</button><button class="btn small" data-block-user="${u.id}" ${u.id===state.user.id?"disabled":""}>${u.blocked?"Desbloquear":"Bloquear"}</button></div></td></tr>`).join("")}</tbody></table></div><div class="pager"><span>${list.length} usuarios</span><div class="pages">${pageButtons(p,Math.max(1,Math.ceil(list.length/PAGE_SIZE)),"user")}</div></div></div>`;$("#up").value=f.provider;$("#ur").value=f.role;$("#ub").value=f.blocked;$("#uq").oninput=()=>{f.q=$("#uq").value;state.pages.users=1;usersView()};$("#up").onchange=()=>{f.provider=$("#up").value;usersView()};$("#ur").onchange=()=>{f.role=$("#ur").value;usersView()};$("#ub").onchange=()=>{f.blocked=$("#ub").value;usersView()};$("#uc").onclick=()=>{state.filters.user={q:"",provider:"",role:"",blocked:""};state.pages.users=1;usersView()};$$('[data-role]').forEach(b=>b.onclick=()=>roleUser(b.dataset.role));$$('[data-block-user]').forEach(b=>b.onclick=()=>blockUser(b.dataset.blockUser))}
function roleUser(id){const u=users.find(x=>x.id===id);if(!u||u.id===state.user.id)return;u.role=u.role==="admin"?"user":"admin";save();tryApi(`/admin/users/${id}`,{method:"PATCH",body:JSON.stringify({role:u.role})});toast("success","Rol actualizado",u.name);usersView()}function blockUser(id){const u=users.find(x=>x.id===id);if(!u||u.id===state.user.id)return;u.blocked=!u.blocked;save();tryApi(`/admin/users/${id}`,{method:"PATCH",body:JSON.stringify({blocked:u.blocked})});toast("success",u.blocked?"Usuario bloqueado":"Usuario desbloqueado",u.name);usersView()}
function couponsView(){ $("#couponsView").innerHTML=`<div class="section"><div><h2>Cupones</h2><p>CRUD de promociones y descuentos.</p></div><button class="btn primary" id="newCoupon">Nuevo cupón</button></div><div class="card table-card"><div class="scroll"><table><thead><tr><th>Código</th><th>Tipo</th><th>Valor</th><th>Usos</th><th>Expiración</th><th>Estado</th><th>Acciones</th></tr></thead><tbody>${coupons.map(c=>`<tr><td><strong>${c.code}</strong></td><td>${c.type==="percent"?"Porcentaje":c.type==="fixed"?"Monto fijo":"Envío"}</td><td>${c.type==="percent"?c.value+"%":c.type==="fixed"?money(c.value):"Gratis"}</td><td>${c.used}/${c.max||"∞"}</td><td>${date(c.expires)}</td><td><span class="badge ${c.active?"b-green":"b-gray"}">${c.active?"Activo":"Inactivo"}</span></td><td><div class="actions"><button class="btn small" data-coupon-edit="${c.id}">Editar</button><button class="btn small" data-coupon-toggle="${c.id}">Activar</button><button class="btn small" data-coupon-delete="${c.id}">Eliminar</button></div></td></tr>`).join("")}</tbody></table></div></div>`;$("#newCoupon").onclick=()=>couponModal();$$('[data-coupon-edit]').forEach(b=>b.onclick=()=>couponModal(b.dataset.couponEdit));$$('[data-coupon-toggle]').forEach(b=>b.onclick=()=>toggleCoupon(b.dataset.couponToggle));$$('[data-coupon-delete]').forEach(b=>b.onclick=()=>deleteCoupon(b.dataset.couponDelete))}
function couponModal(id=null){const c=coupons.find(x=>x.id===id)||{code:"",type:"percent",value:10,max:100,expires:"2026-12-31",active:true};openModal(`<div class="modal"><div class="modal-head"><div><h3>${id?"Editar cupón":"Nuevo cupón"}</h3><p>Configurá las reglas de descuento.</p></div><button class="close">×</button></div><form id="cf"><div class="modal-body"><div class="form"><div class="field"><label>Código *</label><input class="input" id="cc" required value="${esc(c.code)}"></div><div class="field"><label>Tipo</label><select class="select" id="ct"><option value="percent">Porcentaje</option><option value="fixed">Monto fijo</option><option value="shipping">Envío gratis</option></select></div><div class="field"><label>Valor</label><input class="input" id="cv" type="number" value="${c.value}"></div><div class="field"><label>Usos máximos</label><input class="input" id="cm" type="number" value="${c.max}"></div><div class="field"><label>Expiración</label><input class="input" id="ce" type="date" value="${c.expires}"></div><div class="field"><label><input id="ca" type="checkbox" ${c.active?"checked":""}> Activo</label></div></div></div><div class="modal-foot"><button class="btn" type="button" data-close>Cancelar</button><button class="btn primary">Guardar</button></div></form></div>`);$("#ct").value=c.type;$("#cf").onsubmit=async e=>{e.preventDefault();const x={...c,id:id||`c${Date.now()}`,code:$("#cc").value.trim().toUpperCase(),type:$("#ct").value,value:+$("#cv").value,max:+$("#cm").value,expires:$("#ce").value,active:$("#ca").checked};const ix=coupons.findIndex(y=>y.id===x.id);if(ix>=0)coupons[ix]=x;else coupons.unshift(x);save();await tryApi(id?`/admin/coupons/${id}`:"/admin/coupons",{method:id?"PUT":"POST",body:JSON.stringify(x)});closeModal();toast("success","Cupón guardado",x.code);couponsView()}}function toggleCoupon(id){const c=coupons.find(x=>x.id===id);if(!c)return;c.active=!c.active;save();tryApi(`/admin/coupons/${id}`,{method:"PUT",body:JSON.stringify(c)});couponsView()}function deleteCoupon(id){const c=coupons.find(x=>x.id===id);confirmModal("Eliminar cupón",`Se eliminará ${c.code}.`,()=>{coupons.splice(coupons.indexOf(c),1);save();tryApi(`/admin/coupons/${id}`,{method:"DELETE"});couponsView()})}
function settingsView(){ $("#settingsView").innerHTML=`<div class="section"><div><h2>Configuración</h2><p>Datos generales y reglas de operación.</p></div><button class="btn primary" id="saveSettings">Guardar cambios</button></div><div class="settings"><div class="card setting"><div class="head"><div><h2>Datos de la tienda</h2><p>Información de contacto.</p></div></div><div class="form"><div class="field"><label>Nombre</label><input class="input" id="sn" value="${esc(settings.storeName)}"></div><div class="field"><label>Email</label><input class="input" id="se" value="${esc(settings.storeEmail)}"></div><div class="field"><label>Teléfono</label><input class="input" id="sp" value="${esc(settings.storePhone)}"></div><div class="field"><label>Dirección</label><input class="input" id="sa" value="${esc(settings.storeAddress)}"></div></div></div><div class="card setting"><div class="head"><div><h2>Envíos</h2><p>Valores en pesos argentinos.</p></div></div><div class="form"><div class="field"><label>Costo estándar</label><input class="input" id="sc" type="number" value="${settings.shippingCost}"></div><div class="field"><label>Mínimo envío gratis</label><input class="input" id="sf" type="number" value="${settings.freeShippingMinimum}"></div></div></div><div class="card setting"><div class="head"><div><h2>Comportamiento</h2><p>Controles operativos.</p></div></div>${[["maintenance","Modo mantenimiento","Oculta la tienda para visitantes."],["allowRegistration","Permitir registro","Permite crear cuentas."],["allowGuestCheckout","Checkout invitado","Permite comprar sin cuenta."]].map(x=>`<div class="setting-row"><div><strong>${x[1]}</strong><small>${x[2]}</small></div><label class="switch"><input id="${x[0]}" type="checkbox" ${settings[x[0]]?"checked":""}><span class="slider"></span></label></div>`).join("")}</div><div class="card setting"><div class="head"><div><h2>Estado de integración</h2><p>Conectividad con el backend.</p></div></div><div class="setting-row"><div><strong>API</strong><small>${state.api?"Backend conectado":"Modo demo / backend no disponible"}</small></div><span class="badge ${state.api?"b-green":"b-yellow"}">${state.api?"Online":"Demo"}</span></div><div class="setting-row"><div><strong>Polling</strong><small>Los datos se actualizan cada 30 segundos.</small></div><span class="badge b-blue">30 s</span></div><div class="note">Las claves privadas nunca deben guardarse en este HTML. Las integraciones reales se gestionan en el backend.</div></div></div>`;$("#saveSettings").onclick=async()=>{Object.assign(settings,{storeName:$("#sn").value,storeEmail:$("#se").value,storePhone:$("#sp").value,storeAddress:$("#sa").value,shippingCost:+$("#sc").value,freeShippingMinimum:+$("#sf").value,maintenance:$("#maintenance").checked,allowRegistration:$("#allowRegistration").checked,allowGuestCheckout:$("#allowGuestCheckout").checked});save();await tryApi("/admin/settings",{method:"PUT",body:JSON.stringify(settings)});toast("success","Configuración guardada","Los cambios fueron guardados.");settingsView()}}
function openModal(content){$("#modalRoot").innerHTML=`<div class="modal-bg" id="mbg">${content}</div>`;$("#mbg").onclick=e=>{if(e.target.id==="mbg")closeModal()};$$('[data-close],.close').forEach(b=>b.onclick=closeModal)}function closeModal(){$("#modalRoot").innerHTML=""}function confirmModal(title,msg,fn){openModal(`<div class="modal" style="max-width:430px"><div class="modal-head"><div><h3>${esc(title)}</h3><p>Confirmación</p></div><button class="close">×</button></div><div class="modal-body"><p>${esc(msg)}</p></div><div class="modal-foot"><button class="btn" data-close>Cancelar</button><button class="btn danger" id="yes">Confirmar</button></div></div>`);$("#yes").onclick=()=>{closeModal();fn()}}
async function bootstrapSync(){const r=await tryApi("/admin/bootstrap");if(r&&typeof r==="object"){if(r.products)products.splice(0,products.length,...r.products);if(r.orders)orders.splice(0,orders.length,...r.orders);if(r.users)users.splice(0,users.length,...r.users);if(r.coupons)coupons.splice(0,coupons.length,...r.coupons);if(r.settings)Object.assign(settings,{...r.settings,freeShippingMin:r.settings.freeShippingMin??r.settings.freeShippingMinimum,maintenanceMode:r.settings.maintenanceMode??r.settings.maintenance,allowRegister:r.settings.allowRegister??r.settings.allowRegistration});nav(state.view)}}
$("#adminLoginForm").addEventListener("submit",async e=>{e.preventDefault();const email=$("#adminEmail").value.trim(),password=$("#adminPassword").value;if(!email||!password)return;const btn=$("#adminLoginForm button[type='submit']");const err=$("#loginError");err.textContent="";btn.disabled=true;btn.textContent="Ingresando...";try{const r=await fetch(API_URL+"/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email,password})});const data=await r.json().catch(()=>({}));if(!r.ok){err.textContent=data.message||"Credenciales inválidas.";toast("error","No se pudo iniciar sesión",data.message||"Credenciales inválidas.");return}const t=data.token||data.jwt||data.accessToken;if(!t){err.textContent="Respuesta sin token.";toast("error","Error de autenticación","El servidor no devolvió un token.");return}localStorage.setItem(TOKEN_KEY,t);if(data.user)localStorage.setItem(USER_KEY,JSON.stringify(data.user));window.location.reload()}catch(error){err.textContent="No se pudo conectar con el servidor.";toast("error","Error de conexión","No se pudo contactar al backend.")}finally{btn.disabled=false;btn.textContent="Ingresar"}});$$('[data-view]').forEach(b=>b.onclick=()=>nav(b.dataset.view));$$('[data-go]').forEach(b=>b.onclick=()=>nav(b.dataset.go));$("#storeBtn").onclick=()=>location.href="index.html";$("#logoutBtn").onclick=()=>{localStorage.removeItem(TOKEN_KEY);localStorage.removeItem(USER_KEY);location.href="index.html"};$("#menuBtn").onclick=()=>document.body.classList.toggle("menu-open");$("#themeBtn").onclick=()=>{const light=!document.body.classList.contains("light");document.body.classList.toggle("light",light);localStorage.setItem(THEME_KEY,light?"light":"dark");renderChart()};$("#refreshBtn").onclick=async()=>{await bootstrapSync();toast("success","Datos actualizados","Sincronizados con el backend.")};document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});
if(!auth())throw Error("No autorizado");document.body.classList.toggle("light",localStorage.getItem(THEME_KEY)==="light");nav("dashboard");bootstrapSync();setInterval(()=>bootstrapSync(),POLL_MS);
</script>

<script>
(function(){
  const getFocusable=(root)=>[...root.querySelectorAll('a[href],button,input,select,textarea,[tabindex]:not([tabindex="-1"])')].filter((el)=>!el.disabled&&el.offsetParent!==null);
  let activeDialog=null;
  let lastFocus=null;
  const enhance=()=>{
    document.querySelectorAll('button').forEach((button)=>{
      if(!button.getAttribute('aria-label')) button.setAttribute('aria-label',button.textContent.trim().replace(/\s+/g,' ')||'Botón');
    });
    document.querySelectorAll('.modal,.modal-bg').forEach((dialog)=>{
      dialog.setAttribute('role','dialog');
      dialog.setAttribute('aria-modal','true');
    });
    const toastNodes=document.querySelectorAll('[class*="toast"],.toast');
    toastNodes.forEach((node)=>node.setAttribute('role','status'));
  };
  const observer=new MutationObserver(()=>{
    enhance();
    const dialog=document.querySelector('.modal-bg .modal')||document.querySelector('.modal-bg');
    if(dialog && dialog!==activeDialog){
      lastFocus=document.activeElement; activeDialog=dialog;
      const first=getFocusable(dialog)[0]; if(first) first.focus();
    }
    if(!dialog) activeDialog=null;
  });
  observer.observe(document.body,{subtree:true,childList:true});
  document.addEventListener('keydown',(event)=>{
    if(event.key!=='Tab'||!activeDialog) return;
    const items=getFocusable(activeDialog); if(!items.length) return;
    const first=items[0],last=items[items.length-1];
    if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}
    else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}
  });
  enhance();
})();
</script>
