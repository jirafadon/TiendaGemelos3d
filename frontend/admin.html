.sidebar{position:fixed;z-index:100;inset:0 auto 0 0;width:250px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column}.side-brand{height:72px;padding:15px 18px;border-bottom:1px solid var(--line)}.nav{padding:14px 10px;display:grid;gap:3px;flex:1}.nav-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;padding:12px 9px 5px}.nav button{border:0;background:transparent;color:var(--muted);border-radius:9px;padding:11px 12px;text-align:left;display:flex;gap:11px;align-items:center}.nav button:hover{background:var(--panel2);color:var(--text)}.nav button.active{background:#7c5cff20;color:#fff;box-shadow:inset 3px 0 var(--accent)}.side-bottom{border-top:1px solid var(--line);padding:12px}.admin{display:flex;gap:9px;align-items:center;padding-bottom:10px}.avatar{width:34px;height:34px;border-radius:50%;object-fit:cover;background:var(--panel2)}.admin strong{display:block;font-size:12px}.admin small{color:var(--muted)}.main{margin-left:250px;min-height:100vh}.top{height:72px;position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:#090b10ee;backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}body.light .top{background:#f4f6faee}.top h1{margin:0;font-size:20px}.top p{margin:4px 0 0;color:var(--muted);font-size:11px}.top-left,.top-actions{display:flex;align-items:center;gap:10px}.icon{width:38px;height:38px;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:9px}.mobile{display:none}.content{padding:24px;max-width:1700px;margin:auto}.head{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:17px}.head h2{margin:0;font-size:18px}.head p{margin:5px 0 0;color:var(--muted);font-size:11px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.stat{padding:18px}.stat span{color:var(--muted);font-size:11px}.stat strong{display:block;font-size:25px;margin-top:12px}.stat i{float:right;color:#a78bfa;font-size:20px}.grid2{display:grid;grid-template-columns:2fr 1fr;gap:15px;margin-top:15px}.panel{padding:18px}.panel h3{margin:0 0 15px;font-size:14px}.bars{height:240px;display:flex;align-items:flex-end;gap:8px;padding:10px 0}.bar{flex:1;background:var(--accent);border-radius:6px 6px 2px 2px;position:relative;min-width:10px}.bar small{position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);font-size:9px;color:var(--muted);white-space:nowrap}.list{display:grid}.list-row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.list-row:last-child{border:0}.muted{color:var(--muted)}.filters{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;gap:9px;margin-bottom:14px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:760px}th,td{padding:12px;border-bottom:1px solid var(--line);text-align:left}th{font-size:10px;color:var(--muted);text-transform:uppercase;background:var(--panel2)}td{font-size:12px}tbody tr:hover{background:var(--panel2)}.product{display:flex;align-items:center;gap:10px;min-width:220px}.thumb{width:46px;height:46px;border-radius:8px;object-fit:cover;background:var(--panel2)}.product strong{display:block}.product small{color:var(--muted)}.badge{display:inline-flex;padding:5px 8px;border-radius:99px;font-size:10px;font-weight:700}.green{background:#22c55e18;color:#4ade80}.yellow{background:#f59e0b18;color:#fbbf24}.red{background:#ef444418;color:#f87171}.purple{background:#7c5cff20;color:#b9a9ff}.gray{background:var(--panel2);color:var(--muted)}.actions{display:flex;gap:5px;flex-wrap:wrap}.pager{display:flex;justify-content:space-between;align-items:center;padding:12px;color:var(--muted);font-size:11px}.pages{display:flex;gap:4px}.page{width:31px;height:31px;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:7px}.page.active{background:var(--accent);border-color:var(--accent);color:#fff}.page:disabled{opacity:.35}.empty,.loading{text-align:center;padding:40px;color:var(--muted)}.empty strong{display:block;color:var(--text);margin-bottom:5px}.settings{display:grid;grid-template-columns:1fr 1fr;gap:15px}.setting{padding:18px}.setting h3{margin:0 0 16px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.full{grid-column:1/-1}.switch-row{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}.switch-row strong{display:block;font-size:12px}.switch-row small{display:block;color:var(--muted);margin-top:3px}.switch{position:relative;width:44px;height:24px}.switch input{opacity:0;width:0;height:0}.slider{position:absolute;inset:0;background:var(--panel2);border:1px solid var(--line);border-radius:99px}.slider:before{content:"";position:absolute;width:18px;height:18px;left:2px;top:2px;background:var(--muted);border-radius:50%;transition:.2s}.switch input:checked+.slider{background:var(--accent);border-color:var(--accent)}.switch input:checked+.slider:before{transform:translateX(20px);background:#fff}
.modal-bg{position:fixed;inset:0;z-index:500;background:#000b;display:grid;place-items:center;padding:18px}.modal{width:min(850px,100%);max-height:92vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:0 30px 100px #000b}.modal-head{position:sticky;top:0;z-index:2;background:var(--panel);display:flex;justify-content:space-between;align-items:center;padding:17px 20px;border-bottom:1px solid var(--line)}.modal-head h3{margin:0;font-size:17px}.modal-head p{margin:4px 0 0;color:var(--muted);font-size:11px}.modal-body{padding:20px}.modal-foot{position:sticky;bottom:0;background:var(--panel);display:flex;justify-content:flex-end;gap:8px;padding:13px 20px;border-top:1px solid var(--line)}.close{width:34px;height:34px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);color:var(--text)}.upload{border:2px dashed var(--line);border-radius:12px;padding:17px;text-align:center}.upload input{display:none}.upload strong{display:block;margin:5px}.upload small{color:var(--muted)}.images{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:12px}.image{position:relative;aspect-ratio:1;background:var(--panel2);border-radius:9px;overflow:hidden}.image img{width:100%;height:100%;object-fit:cover}.image button{position:absolute;right:4px;top:4px;width:24px;height:24px;border:0;border-radius:50%;background:var(--danger);color:#fff}.notice{padding:12px;border:1px dashed var(--line);border-radius:9px;color:var(--muted);font-size:11px}.toast-wrap{position:fixed;right:18px;bottom:18px;z-index:1000;width:min(360px,calc(100vw - 36px));display:grid;gap:8px}.toast{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:12px;box-shadow:0 15px 45px #0007}.toast strong,.toast span{display:block}.toast strong{font-size:12px}.toast span{color:var(--muted);font-size:11px;margin-top:4px}.toast.ok{border-color:#22c55e55}.toast.err{border-color:#ef444455}
@media(max-width:1050px){.stats{grid-template-columns:repeat(2,1fr)}.grid2,.settings{grid-template-columns:1fr}.filters{grid-template-columns:1fr 1fr}.filters .search{grid-column:1/-1}}@media(max-width:800px){.sidebar{transform:translateX(-100%);transition:.2s}.menu-open .sidebar{transform:translateX(0)}.main{margin-left:0}.mobile{display:block}.content{padding:18px 12px}.top{padding:0 12px}}@media(max-width:600px){.stats,.form-grid,.filters{grid-template-columns:1fr}.filters .search{grid-column:auto}.images{grid-template-columns:repeat(3,1fr)}.head{align-items:flex-start;flex-direction:column}}

<body>
<div id="loginScreen" class="login"><div class="login-card"><div class="brand"><div class="brand-icon"><i class="fa-solid fa-cube"></i></div><span>Tienda Gemelos 3D</span></div><h1>Panel administrador</h1><p>Ingresá con tu cuenta de administrador.</p><form id="loginForm" class="stack"><div class="field"><label>Email</label><input id="loginEmail" class="input" type="email" autocomplete="username" required></div><div class="field"><label>Contraseña</label><input id="loginPassword" class="input" type="password" autocomplete="current-password" required></div><div id="loginError" class="error"></div><button id="loginButton" class="btn primary" type="submit"><i class="fa-solid fa-right-to-bracket"></i> Ingresar</button></form></div></div>
<div id="app" class="hidden">
<aside class="sidebar"><div class="side-brand"><div class="brand"><div class="brand-icon"><i class="fa-solid fa-cube"></i></div><span>Tienda Gemelos 3D</span></div></div><nav class="nav"><div class="nav-label">Panel</div><button data-view="dashboard" class="active"><i class="fa-solid fa-chart-line"></i>Dashboard</button><button data-view="products"><i class="fa-solid fa-box"></i>Productos</button><button data-view="orders"><i class="fa-solid fa-receipt"></i>Pedidos</button><button data-view="users"><i class="fa-solid fa-users"></i>Usuarios</button><div class="nav-label">Administración</div><button data-view="coupons"><i class="fa-solid fa-ticket"></i>Cupones</button><button data-view="settings"><i class="fa-solid fa-sliders"></i>Configuración</button></nav><div class="side-bottom"><div class="admin"><img id="adminAvatar" class="avatar" alt=""><div><strong id="adminName">Administrador</strong><small id="adminEmail"></small></div></div><button id="logoutButton" class="btn" style="width:100%"><i class="fa-solid fa-right-from-bracket"></i> Cerrar sesión</button></div></aside>
<main class="main"><header class="top"><div class="top-left"><button id="menuButton" class="icon mobile" aria-label="Menú"><i class="fa-solid fa-bars"></i></button><div><h1 id="title">Dashboard</h1><p id="subtitle">Resumen general de la tienda</p></div></div><div class="top-actions"><button id="themeButton" class="icon" title="Tema"><i class="fa-solid fa-sun"></i></button><button id="refreshButton" class="icon" title="Actualizar"><i class="fa-solid fa-rotate"></i></button></div></header><section class="content"><div id="dashboardView"></div><div id="productsView" class="hidden"></div><div id="ordersView" class="hidden"></div><div id="usersView" class="hidden"></div><div id="couponsView" class="hidden"></div><div id="settingsView" class="hidden"></div></section></main></div>
<div id="modalRoot"></div><div id="toastWrap" class="toast-wrap"></div>
<script>
const API='/api',TOKEN='tiendagemelos3d_token',THEME='tiendagemelos3d_admin_theme',SIZE=20;
let view='dashboard',productPage=1,orderPage=1,userPage=1,productPages=1,orderPages=1,userPages=1,search='',category='',status='',sort='new',orderStatus='all',payMethod='all',provider='all',role='all',currentProducts=[],currentUsers=[];
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=v=>new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0}).format(Number(v)||0);
const date=v=>{if(!v)return'—';const d=new Date(v);return Number.isNaN(d.getTime())?'—':d.toLocaleDateString('es-AR')};
const badge=v=>{const m={pending:['Pendiente','yellow'],paid:['Pagado','green'],shipped:['Enviado','purple'],delivered:['Entregado','green'],cancelled:['Cancelado','red'],active:['Activo','green'],inactive:['Inactivo','gray']},x=m[String(v||'').toLowerCase()]||[v||'Sin estado','gray'];return'<span class="badge '+x[1]+'">'+esc(x[0])+'</span>'};
function toast(type,title,msg){const n=document.createElement('div');n.className='toast '+(type==='success'?'ok':'err');n.innerHTML='<strong>'+esc(title)+'</strong><span>'+esc(msg||'')+'</span>';$('#toastWrap').append(n);setTimeout(()=>n.remove(),4500)}
async function api(path,opt={}){
 const h=new Headers(opt.headers||{});if(opt.body&&!(opt.body instanceof FormData))h.set('Content-Type','application/json');if(localStorage.getItem(TOKEN))h.set('Authorization','Bearer '+localStorage.getItem(TOKEN));
 const r=await fetch(API+path,{...opt,headers:h}),d=await r.json().catch(()=>({}));if(r.status===401){localStorage.removeItem(TOKEN);showLogin();throw Error(d.message||'Tu sesión expiró.')}if(!r.ok)throw Error(d.message||'Error del servidor.');return d
}
function showLogin(){$('#loginScreen').classList.remove('hidden');$('#app').classList.add('hidden')}
function showApp(){$('#loginScreen').classList.add('hidden');$('#app').classList.remove('hidden')}
function setView(v){view=v;const t={dashboard:['Dashboard','Resumen general de la tienda'],products:['Productos','Catálogo conectado al backend'],orders:['Pedidos','Pedidos del backend'],users:['Usuarios','Cuentas y permisos'],coupons:['Cupones','Promociones'],settings:['Configuración','Configuración general']};$('#title').textContent=t[v][0];$('#subtitle').textContent=t[v][1];['dashboard','products','orders','users','coupons','settings'].forEach(x=>$('#'+x+'View').classList.toggle('hidden',x!==v));$$('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===v));document.body.classList.remove('menu-open')}
async function nav(v){setView(v);try{if(v==='dashboard')await dashboard();if(v==='products')await products();if(v==='orders')await orders();if(v==='users')await users();if(v==='coupons')await coupons();if(v==='settings')await settings()}catch(e){if(e.message!=='Tu sesión expiró.')toast('error','No se pudo cargar',e.message)}}
function loading(v){$('#'+v+'View').innerHTML='<div class="card loading"><i class="fa-solid fa-spinner fa-spin"></i> Cargando...</div>'}
async function dashboard(){loading('dashboard');const [s,c,t]=await Promise.all([api('/admin/dashboard'),api('/admin/dashboard/sales-chart'),api('/admin/dashboard/top-products')]);const a=c.sales||[],max=Math.max(1,...a.map(x=>Number(x.total)||0));$('#dashboardView').innerHTML='<div class="stats">'+stat('Ventas del mes',money(s.monthlyRevenue),'fa-coins')+stat('Pedidos',s.totalOrders,'fa-receipt')+stat('Productos activos',s.activeProducts,'fa-box')+stat('Usuarios',s.totalUsers,'fa-users')+'</div><div class="grid2"><div class="card panel"><h3>Ventas últimos 7 días</h3><div class="bars">'+(a.length?a.map(x=>'<div class="bar" style="height:'+Math.max(4,(Number(x.total)||0)/max*90)+'%"><small>'+esc(String(x._id).slice(5))+'</small></div>').join(''):'<div class="empty">Sin ventas.</div>')+'</div></div><div class="card panel"><h3>Más vendidos</h3><div class="list">'+((t.products||[]).map((p,i)=>'<div class="list-row"><span>'+(i+1)+'. '+esc(p.name)+'</span><b>'+Number(p.salesCount||0)+'</b></div>').join('')||'<div class="empty">Sin datos.</div>')+'</div></div></div>'}
function stat(l,v,i){return'<div class="card stat"><i class="fa-solid '+i+'"></i><span>'+esc(l)+'</span><strong>'+esc(v)+'</strong></div>'}
function pages(p,n,type){if(n<=1)return'';let h='<button class="page" '+(p<=1?'disabled':'')+' data-p="'+type+'" data-n="'+(p-1)+'">‹</button>';for(let i=Math.max(1,p-2);i<=Math.min(n,p+2);i++)h+='<button class="page '+(i===p?'active':'')+'" data-p="'+type+'" data-n="'+i+'">'+i+'</button>';h+='<button class="page" '+(p>=n?'disabled':'')+' data-p="'+type+'" data-n="'+(p+1)+'">›</button>';setTimeout(()=>$$('[data-p="'+type+'"]').forEach(b=>b.onclick=()=>go(type,+b.dataset.n)),0);return h}
function go(type,n){if(type==='products'&&n>=1&&n<=productPages){productPage=n;products()}if(type==='orders'&&n>=1&&n<=orderPages){orderPage=n;orders()}if(type==='users'&&n>=1&&n<=userPages){userPage=n;users()}}
const debounce=(fn,ms)=>{let t;return()=>{clearTimeout(t);t=setTimeout(fn,ms)}};
async function products(){
 loading('products');const q=new URLSearchParams({page:productPage,limit:SIZE,search,category,status,sort}),d=await api('/admin/products?'+q);productPages=Math.max(1,+d.pages||1);currentProducts=d.products||[];const cats=[...new Set(currentProducts.map(p=>p.category).filter(Boolean))].sort();
 $('#productsView').innerHTML='<div class="head"><div><h2>Productos</h2><p>'+Number(d.total||0)+' productos en el backend.</p></div><button id="newProduct" class="btn primary"><i class="fa-solid fa-plus"></i> Nuevo producto</button></div><div class="filters"><input id="productSearch" class="input search" placeholder="Buscar por nombre..." value="'+esc(search)+'"><select id="productCategory" class="select"><option value="">Todas las categorías</option>'+cats.map(c=>'<option value="'+esc(c)+'">'+esc(c)+'</option>').join('')+'</select><select id="productStatus" class="select"><option value="">Todos</option><option value="active">Activos</option><option value="inactive">Inactivos</option></select><select id="productSort" class="select"><option value="new">Más nuevos</option><option value="popular">Más vendidos</option><option value="priceAsc">Precio ↑</option><option value="priceDesc">Precio ↓</option><option value="rating">Rating</option></select></div><div class="card table-wrap"><table><thead><tr><th>Producto</th><th>Categoría</th><th>Precio</th><th>Stock</th><th>Rating</th><th>Estado</th><th>Acciones</th></tr></thead><tbody>'+(currentProducts.length?currentProducts.map(row).join(''):'<tr><td colspan="7"><div class="empty"><strong>No hay productos.</strong>Creá uno con “Nuevo producto”.</div></td></tr>')+'</tbody></table><div class="pager"><span>Página '+productPage+' de '+productPages+'</span><div class="pages">'+pages(productPage,productPages,'products')+'</div></div></div>';
 $('#productSearch').oninput=debounce(()=>{search=$('#productSearch').value.trim();productPage=1;products()},350);$('#productCategory').value=category;$('#productStatus').value=status;$('#productSort').value=sort;$('#productCategory').onchange=()=>{category=$('#productCategory').value;productPage=1;products()};$('#productStatus').onchange=()=>{status=$('#productStatus').value;productPage=1;products()};$('#productSort').onchange=()=>{sort=$('#productSort').value;productPage=1;products()};$('#newProduct').onclick=()=>productModal();$$('[data-edit]').forEach(b=>b.onclick=()=>productModal(b.dataset.edit));$$('[data-delete]').forEach(b=>b.onclick=()=>deleteProduct(b.dataset.delete));$$('[data-toggle]').forEach(b=>b.onclick=()=>toggleProduct(b.dataset.toggle))
}
function row(p){const id=String(p._id),im=p.image||(p.images||[])[0]||'';return'<tr><td><div class="product">'+(im?'<img class="thumb" src="'+esc(im)+'" alt="">':'<div class="thumb"></div>')+'<div><strong>'+esc(p.name)+'</strong><small>'+esc(p.slug||id)+'</small></div></div></td><td>'+esc(p.category||'—')+'</td><td>'+money(p.price)+'</td><td>'+Number(p.stock||0)+'</td><td>★ '+Number(p.rating||0).toFixed(1)+' <span class="muted">('+Number(p.reviews||0)+')</span></td><td>'+badge(p.active?'active':'inactive')+'</td><td><div class="actions"><button class="btn small" data-edit="'+id+'"><i class="fa-solid fa-pen"></i></button><button class="btn small" data-toggle="'+id+'">'+(p.active?'Desactivar':'Activar')+'</button><button class="btn small danger" data-delete="'+id+'"><i class="fa-solid fa-trash"></i></button></div></td></tr>'}
function field(id,label,value,type='text',required=false){return'<div class="field"><label>'+esc(label)+'</label><input id="'+id+'" class="input" type="'+type+'" value="'+esc(value)+'" '+(required?'required':'')+(type==='number'?' min="0" step="0.01"':'')+'></div>'}
async function productModal(id=''){
 let p=id?currentProducts.find(x=>String(x._id)===String(id)):null;if(id&&!p){toast('error','Producto no encontrado','Recargá la lista.');return}p=p||{name:'',description:'',category:'',price:0,oldPrice:'',stock:0,rating:0,reviews:0,tags:[],image:'',images:[],active:true,variants:{color:[],size:[]}};let imgs=(p.images&&p.images.length?p.images:(p.image?[p.image]:[])).slice(0,6);
 $('#modalRoot').innerHTML='<div class="modal-bg" id="productBg"><div class="modal"><div class="modal-head"><div><h3>'+(id?'Editar producto':'Nuevo producto')+'</h3><p>Guardado directo mediante API.</p></div><button id="closeProduct" class="close" type="button">×</button></div><form id="productForm"><div class="modal-body"><div class="form-grid">'+field('pName','Nombre *',p.name,'text',true)+field('pCategory','Categoría *',p.category,'text',true)+'<div class="field full"><label>Descripción</label><textarea id="pDescription" class="textarea">'+esc(p.description||'')+'</textarea></div>'+field('pPrice','Precio *',p.price,'number',true)+field('pOld','Precio anterior',p.oldPrice??'','number')+field('pStock','Stock',p.stock??0,'number')+field('pRating','Rating',p.rating??0,'number')+field('pReviews','Reviews',p.reviews??0,'number')+'<div class="field full"><label>Tags</label><input id="pTags" class="input" value="'+esc((p.tags||[]).join(', '))+'"></div>'+field('pColors','Variantes color',(p.variants?.color||[]).join(', '))+field('pSizes','Variantes tamaño',(p.variants?.size||[]).join(', '))+'<div class="field full"><label>Imágenes · máximo 6</label><div class="upload"><label for="pImages" style="cursor:pointer"><i class="fa-solid fa-cloud-arrow-up"></i><strong>Seleccionar imágenes</strong><small>JPG, PNG, WEBP o GIF · 8 MB por archivo</small></label><input id="pImages" type="file" accept="image/jpeg,image/png,image/webp,image/gif" multiple><div id="imageList" class="images"></div></div></div><div class="field full"><label><input id="pActive" type="checkbox" '+(p.active!==false?'checked':'')+'> Activo</label></div></div></div><div class="modal-foot"><button id="cancelProduct" class="btn" type="button">Cancelar</button><button id="saveProduct" class="btn primary" type="submit">Guardar producto</button></div></form></div></div>';
 let uploaded=imgs.map(url=>({url}));
 const render=()=>{$('#imageList').innerHTML=uploaded.length?uploaded.map((x,i)=>'<div class="image"><img src="'+esc(x.url)+'" alt=""><button type="button" data-remove="'+i+'">×</button></div>').join(''):'<div class="notice" style="grid-column:1/-1">Todavía no hay imágenes.</div>';$$('[data-remove]').forEach(b=>b.onclick=()=>{uploaded.splice(+b.dataset.remove,1);render()})};render();
 $('#closeProduct').onclick=closeModal;$('#cancelProduct').onclick=closeModal;$('#productBg').onclick=e=>{if(e.target.id==='productBg')closeModal()};
 $('#pImages').onchange=async e=>{const files=[...e.target.files];if(!files.length)return;if(uploaded.length+files.length>6){toast('error','Demasiadas imágenes','El máximo es 6.');e.target.value='';return}const fd=new FormData();files.forEach(f=>fd.append('images',f));e.target.disabled=true;try{const d=await api('/admin/upload-multiple',{method:'POST',body:fd});(d.urls||[]).forEach(url=>uploaded.push({url}));render();toast('success','Imágenes subidas',String((d.urls||[]).length)+' imagen(es) subida(s).')}catch(err){toast('error','Error al subir',err.message)}finally{e.target.disabled=false;e.target.value=''}};
 $('#productForm').onsubmit=async e=>{e.preventDefault();const b=$('#saveProduct');b.disabled=true;b.textContent='Guardando...';const payload={name:$('#pName').value.trim(),description:$('#pDescription').value.trim(),category:$('#pCategory').value.trim().toLowerCase(),price:Number($('#pPrice').value),oldPrice:$('#pOld').value===''?null:Number($('#pOld').value),stock:Number($('#pStock').value||0),rating:Number($('#pRating').value||0),reviews:Number($('#pReviews').value||0),tags:$('#pTags').value.split(',').map(x=>x.trim()).filter(Boolean),image:uploaded[0]?.url||'',images:uploaded.map(x=>x.url).slice(0,6),active:$('#pActive').checked,variants:{color:$('#pColors').value.split(',').map(x=>x.trim()).filter(Boolean),size:$('#pSizes').value.split(',').map(x=>x.trim()).filter(Boolean)}};try{const d=await api(id?'/admin/products/'+encodeURIComponent(id):'/admin/products',{method:id?'PUT':'POST',body:JSON.stringify(payload)});if(!d.success)throw Error(d.message||'No se pudo guardar.');closeModal();toast('success','Producto guardado',id?'Producto actualizado.':'Producto creado.');await products()}catch(err){toast('error','No se pudo guardar',err.message)}finally{b.disabled=false;b.textContent='Guardar producto'}}
}
function closeModal(){$('#modalRoot').innerHTML=''}
async function deleteProduct(id){if(!confirm('¿Desactivar este producto?'))return;try{const d=await api('/admin/products/'+encodeURIComponent(id),{method:'DELETE'});toast('success','Producto desactivado',d.message||'OK');await products()}catch(e){toast('error','No se pudo eliminar',e.message)}}
async function toggleProduct(id){try{const d=await api('/admin/products/'+encodeURIComponent(id)+'/toggle',{method:'PATCH'});toast('success','Estado actualizado',d.product?.active?'Producto activado.':'Producto desactivado.');await products()}catch(e){toast('error','No se pudo cambiar',e.message)}}
async function orders(){loading('orders');const q=new URLSearchParams({page:orderPage,limit:SIZE,status:orderStatus,payMethod}),d=await api('/admin/orders?'+q);orderPages=Math.max(1,+d.pages||1);const a=d.orders||[];$('#ordersView').innerHTML='<div class="head"><div><h2>Pedidos</h2><p>'+Number(d.total||0)+' pedidos.</p></div></div><div class="filters"><select id="orderStatus" class="select"><option value="all">Todos los estados</option><option value="pending">Pendiente</option><option value="paid">Pagado</option><option value="cancelled">Cancelado</option></select><select id="payMethod" class="select"><option value="all">Todos los métodos</option><option value="mercadopago">Mercado Pago</option><option value="paypal">PayPal</option><option value="stripe">Stripe</option></select></div><div class="card table-wrap"><table><thead><tr><th>Número</th><th>Cliente</th><th>Total</th><th>Método</th><th>Pago</th><th>Envío</th><th>Fecha</th></tr></thead><tbody>'+(a.length?a.map(o=>'<tr><td><b>'+esc(o.number||o._id)+'</b></td><td>'+esc(o.customer?.name||o.user?.name||'—')+'<br><small class="muted">'+esc(o.customer?.email||o.user?.email||'')+'</small></td><td>'+money(o.total)+'</td><td>'+esc(o.payMethod||'—')+'</td><td>'+badge(o.payStatus)+'</td><td>'+badge(o.shippingStatus)+'</td><td>'+date(o.createdAt)+'</td></tr>').join(''):'<tr><td colspan="7"><div class="empty">No hay pedidos.</div></td></tr>')+'</tbody></table><div class="pager"><span>Página '+orderPage+' de '+orderPages+'</span><div class="pages">'+pages(orderPage,orderPages,'orders')+'</div></div></div>';$('#orderStatus').value=orderStatus;$('#payMethod').value=payMethod;$('#orderStatus').onchange=()=>{orderStatus=$('#orderStatus').value;orderPage=1;orders()};$('#payMethod').onchange=()=>{payMethod=$('#payMethod').value;orderPage=1;orders()}}
async function users(){loading('users');const q=new URLSearchParams({page:userPage,limit:SIZE,provider,role}),d=await api('/admin/users?'+q);userPages=Math.max(1,+d.pages||1);currentUsers=d.users||[];$('#usersView').innerHTML='<div class="head"><div><h2>Usuarios</h2><p>'+Number(d.total||0)+' usuarios.</p></div></div><div class="filters"><select id="provider" class="select"><option value="all">Todos los proveedores</option><option value="local">Email</option><option value="google">Google</option></select><select id="role" class="select"><option value="all">Todos los roles</option><option value="user">Usuario</option><option value="admin">Administrador</option></select></div><div class="card table-wrap"><table><thead><tr><th>Usuario</th><th>Proveedor</th><th>Rol</th><th>Estado</th><th>Registro</th><th>Acciones</th></tr></thead><tbody>'+(currentUsers.length?currentUsers.map(u=>'<tr><td><div class="product">'+(u.avatar?'<img class="avatar" src="'+esc(u.avatar)+'" alt="">':'<div class="avatar"></div>')+'<div><b>'+esc(u.name)+'</b><small>'+esc(u.email)+'</small></div></div></td><td>'+esc(u.provider||'local')+'</td><td>'+(u.role==='admin'?'<span class="badge purple">Administrador</span>':'<span class="badge gray">Usuario</span>')+'</td><td>'+(u.blocked?'<span class="badge red">Bloqueado</span>':'<span class="badge green">Activo</span>')+'</td><td>'+date(u.createdAt)+'</td><td><div class="actions"><button class="btn small" data-user-role="'+u._id+'">'+(u.role==='admin'?'Quitar admin':'Hacer admin')+'</button><button class="btn small" data-user-block="'+u._id+'">'+(u.blocked?'Desbloquear':'Bloquear')+'</button></div></td></tr>').join(''):'<tr><td colspan="6"><div class="empty">No hay usuarios.</div></td></tr>')+'</tbody></table><div class="pager"><span>Página '+userPage+' de '+userPages+'</span><div class="pages">'+pages(userPage,userPages,'users')+'</div></div></div>';$('#provider').value=provider;$('#role').value=role;$('#provider').onchange=()=>{provider=$('#provider').value;userPage=1;users()};$('#role').onchange=()=>{role=$('#role').value;userPage=1;users()};$$('[data-user-role]').forEach(b=>b.onclick=()=>userUpdate(b.dataset.userRole,'role'));$$('[data-user-block]').forEach(b=>b.onclick=()=>userUpdate(b.dataset.userBlock,'blocked'))}
async function userUpdate(id,kind){const u=currentUsers.find(x=>String(x._id)===String(id));if(!u)return;const body=kind==='role'?{role:u.role==='admin'?'user':'admin'}:{blocked:!u.blocked};try{await api('/admin/users/'+encodeURIComponent(id),{method:'PATCH',body:JSON.stringify(body)});toast('success','Usuario actualizado','Cambios guardados.');await users()}catch(e){toast('error','No se pudo actualizar',e.message)}}
async function coupons(){loading('coupons');const d=await api('/admin/coupons'),a=d.coupons||[];$('#couponsView').innerHTML='<div class="head"><div><h2>Cupones</h2><p>'+a.length+' cupones.</p></div></div><div class="card table-wrap"><table><thead><tr><th>Código</th><th>Tipo</th><th>Valor</th><th>Usos</th><th>Expira</th><th>Estado</th></tr></thead><tbody>'+(a.length?a.map(c=>'<tr><td><b>'+esc(c.code)+'</b></td><td>'+esc(c.type)+'</td><td>'+(c.type==='percent'?Number(c.value)+'%':c.type==='shipping'?'Gratis':money(c.value))+'</td><td>'+Number(c.usedCount||0)+' / '+(c.maxUses==null?'∞':Number(c.maxUses))+'</td><td>'+date(c.expiresAt)+'</td><td>'+badge(c.active===false?'inactive':'active')+'</td></tr>').join(''):'<tr><td colspan="6"><div class="empty">No hay cupones.</div></td></tr>')+'</tbody></table></div>'}
function switchRow(id,title,desc,on){return'<div class="switch-row"><div><strong>'+esc(title)+'</strong><small>'+esc(desc)+'</small></div><label class="switch"><input id="'+id+'" type="checkbox" '+(on?'checked':'')+'><span class="slider"></span></label></div>'}
async function settings(){loading('settings');const d=await api('/admin/settings'),s=d.settings||{};$('#settingsView').innerHTML='<div class="head"><div><h2>Configuración</h2><p>Valores guardados en el backend.</p></div><button id="saveSettings" class="btn primary">Guardar cambios</button></div><div class="settings"><div class="card setting"><h3>Datos de la tienda</h3><div class="form-grid">'+field('sName','Nombre',s.storeName||'')+field('sEmail','Email',s.storeEmail||'','email')+field('sPhone','Teléfono',s.storePhone||'')+field('sAddress','Dirección',s.storeAddress||'')+'</div></div><div class="card setting"><h3>Envíos</h3><div class="form-grid">'+field('sCost','Costo estándar',s.shippingCost??0,'number')+field('sFree','Mínimo envío gratis',s.freeShippingMin??0,'number')+'</div></div><div class="card setting"><h3>Comportamiento</h3>'+switchRow('sMaintenance','Modo mantenimiento','Oculta la tienda.',!!s.maintenanceMode)+switchRow('sRegister','Permitir registro','Permite crear cuentas.',s.allowRegister!==false)+switchRow('sGuest','Checkout invitado','Permite comprar sin cuenta.',!!s.allowGuestCheckout)+'</div></div>';$('#saveSettings').onclick=async()=>{const body={storeName:$('#sName').value.trim(),storeEmail:$('#sEmail').value.trim(),storePhone:$('#sPhone').value.trim(),storeAddress:$('#sAddress').value.trim(),shippingCost:+$('#sCost').value||0,freeShippingMin:+$('#sFree').value||0,maintenanceMode:$('#sMaintenance').checked,allowRegister:$('#sRegister').checked,allowGuestCheckout:$('#sGuest').checked};try{await api('/admin/settings',{method:'PUT',body:JSON.stringify(body)});toast('success','Configuración guardada','Cambios guardados.');await settings()}catch(e){toast('error','No se pudo guardar',e.message)}}}
async function login(e){e.preventDefault();const b=$('#loginButton'),err=$('#loginError');err.textContent='';b.disabled=true;try{const r=await fetch(API+'/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('#loginEmail').value.trim(),password:$('#loginPassword').value})}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.message||'Credenciales incorrectas.');if(!d.token)throw Error('El backend no devolvió JWT.');localStorage.setItem(TOKEN,d.token);await init()}catch(x){err.textContent=x.message;toast('error','No se pudo iniciar sesión',x.message)}finally{b.disabled=false}}
async function init(){if(!localStorage.getItem(TOKEN)){showLogin();return}try{const d=await api('/auth/me');if(d.user?.role!=='admin')throw Error('La cuenta no tiene permisos de administrador.');$('#adminName').textContent=d.user.name||'Administrador';$('#adminEmail').textContent=d.user.email||'';if(d.user.avatar)$('#adminAvatar').src=d.user.avatar;showApp();await nav(view)}catch(e){localStorage.removeItem(TOKEN);showLogin();if(e.message!=='Tu sesión expiró.')toast('error','Acceso rechazado',e.message)}}
$('#loginForm').addEventListener('submit',login);$$('[data-view]').forEach(b=>b.addEventListener('click',()=>nav(b.dataset.view)));$('#logoutButton').onclick=async()=>{try{await api('/auth/logout',{method:'POST'})}catch{}localStorage.removeItem(TOKEN);showLogin()};$('#refreshButton').onclick=()=>nav(view);$('#menuButton').onclick=()=>document.body.classList.toggle('menu-open');$('#themeButton').onclick=()=>{const l=document.body.classList.toggle('light');localStorage.setItem(THEME,l?'light':'dark');theme()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});function theme(){const l=localStorage.getItem(THEME)==='light';document.body.classList.toggle('light',l);$('#themeButton').innerHTML='<i class="fa-solid fa-'+(l?'moon':'sun')+'"></i>'}theme();init();
</script>
</body>
</html>
