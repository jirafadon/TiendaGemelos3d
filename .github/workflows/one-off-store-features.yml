name: one-off-store-features
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message == 'chore: add temporary feature patch runner'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply requested frontend features
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('frontend/index.html')
          s = p.read_text()
          css = r'''
    /* Wishlist / recently viewed / mobile-first enhancements */
    .wish-btn{position:absolute;right:10px;top:10px;width:36px;height:36px;border:1px solid rgba(255,255,255,.65);border-radius:50%;background:rgba(255,255,255,.82);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);display:grid;place-items:center;color:#777;z-index:4;padding:0;transition:.18s}
    .wish-btn:hover{background:rgba(255,235,235,.95);color:#ef4444}
    .wish-btn.is-active{color:#ef4444;background:rgba(255,255,255,.94)}
    .wishlist-header-btn{position:relative}
    .wishlist-header-btn .wishlist-badge{position:absolute;top:-6px;right:1px;min-width:19px;height:19px;padding:0 5px;border-radius:99px;background:#ef4444;color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center}
    #recentlyViewed{background:#fff}
    #wishlistProducts{grid-template-columns:repeat(3,1fr);gap:14px}
    #wishlistProducts .product-card:hover{transform:none}
    body.is-mobile .wish-btn{width:32px;height:32px;right:7px;top:7px}
    body.is-mobile .header-main{height:64px;min-height:64px}
    body.is-mobile .logo img{height:40px;max-width:110px}
    body.is-mobile .search-wrap{top:64px}
    body.is-mobile .header{margin-bottom:52px}
    body.is-mobile .topbar{font-size:11px;padding:6px 10px}
    body.is-mobile .header-actions{gap:8px}
    body.is-mobile .header-action{min-width:36px}
    body.is-mobile .product-grid{grid-template-columns:repeat(2,1fr);gap:8px}
    body.is-mobile .product-body{padding:10px}
    body.is-mobile .product-name{font-size:13px}
    body.is-mobile .price{font-size:17px}
    body.is-mobile .product-actions .btn{padding:14px 18px;font-size:14px}
    body.is-mobile .modal-backdrop{padding:0}
    body.is-mobile .modal{width:100vw;height:100vh;max-height:none;border-radius:0}
    body.is-mobile .related-grid{grid-template-columns:repeat(2,1fr);gap:8px}
    body.is-mobile #wishlistProducts{grid-template-columns:repeat(2,1fr);gap:8px}
    @media(max-width:767px){#wishlistProducts{grid-template-columns:repeat(2,1fr);gap:8px}.wish-btn{width:32px;height:32px}}
          '''
          if '/* Wishlist / recently viewed / mobile-first enhancements */' not in s:
              s = s.replace('</style>', css + '\n  </style>', 1)

          recent_section = '''\n    <section id="recentlyViewed" class="hidden">\n      <div class="container">\n        <h2 class="section-title">Vistos recientemente</h2>\n        <div id="recentProducts" class="product-grid"></div>\n      </div>\n    </section>\n'''
          if 'id="recentlyViewed"' not in s:
              s = s.replace('\n    <section class="benefits">', recent_section + '\n    <section class="benefits">', 1)

          feature_block = r'''

    /* === Added storefront UX features: wishlist, recently viewed, mobile detection === */
    const WISHLIST_KEY = 'tg3d_wishlist';
    const RECENT_KEY = 'tg3d_recent';

    function getWishlist(){
      try { const value = JSON.parse(localStorage.getItem(WISHLIST_KEY) || '[]'); return Array.isArray(value) ? value.map(String) : []; }
      catch { return []; }
    }
    function saveWishlist(ids){ localStorage.setItem(WISHLIST_KEY, JSON.stringify([...new Set(ids.map(String))])); }
    function isInWishlist(id){ return getWishlist().includes(String(id)); }
    function updateWishlistCount(){
      const ids = getWishlist();
      const count = document.querySelector('#wishlistCount');
      const icon = document.querySelector('#wishlistBtnIcon');
      if(count) count.textContent = ids.length;
      if(icon) icon.className = ids.length ? 'fa-solid fa-heart' : 'fa-regular fa-heart';
    }
    function rerenderProductButtons(){
      document.querySelectorAll('.wish-btn[data-wish]').forEach((button)=>{
        const active = isInWishlist(button.dataset.wish);
        button.classList.toggle('is-active', active);
        button.setAttribute('aria-pressed', String(active));
        button.innerHTML = '<i class="' + (active ? 'fa-solid' : 'fa-regular') + ' fa-heart"></i>';
      });
      updateWishlistCount();
    }
    function toggleWishlist(id){
      const key = String(id); const ids = getWishlist(); const index = ids.indexOf(key);
      if(index === -1){ ids.unshift(key); saveWishlist(ids); toast('Agregado a favoritos'); }
      else { ids.splice(index,1); saveWishlist(ids); toast('Quitado de favoritos'); }
      rerenderProductButtons();
      if(document.querySelector('#wishlistProducts')) showWishlistModal();
    }

    function getRecent(){
      try { const value = JSON.parse(localStorage.getItem(RECENT_KEY) || '[]'); return Array.isArray(value) ? value.map(String) : []; }
      catch { return []; }
    }
    function addRecent(id){
      const key = String(id); const ids = getRecent().filter((value)=>value !== key); ids.unshift(key);
      localStorage.setItem(RECENT_KEY, JSON.stringify(ids.slice(0,6)));
    }
    function renderRecent(){
      const section = document.querySelector('#recentlyViewed'); const grid = document.querySelector('#recentProducts');
      if(!section || !grid) return;
      const recent = getRecent().map((id)=>products.find((p)=>String(p._id)===id)).filter((p)=>p && p.active !== false).slice(0,6);
      if(!recent.length){ section.classList.add('hidden'); grid.innerHTML=''; return; }
      section.classList.remove('hidden'); grid.innerHTML = recent.map(productCard).join(''); bindProductButtons();
    }

    function showWishlistModal(){
      const ids = getWishlist();
      const favorites = ids.map((id)=>products.find((p)=>String(p._id)===id)).filter((p)=>p && p.active !== false);
      const body = favorites.length
        ? '<div id="wishlistProducts" class="product-grid">' + favorites.map(productCard).join('') + '</div>'
        : '<div class="empty"><i class="fa-regular fa-heart" style="font-size:34px;margin-bottom:12px"></i><div>Todavía no agregaste productos a favoritos</div><button class="btn btn-primary" id="wishlistBrowseBtn" type="button" style="margin-top:16px">Ver productos</button></div>';
      openModal('Mis favoritos', body);
      if(favorites.length) bindProductButtons();
      const browse = document.querySelector('#wishlistBrowseBtn');
      if(browse) browse.onclick = ()=>{ closeModal(); document.querySelector('#novedades')?.scrollIntoView({behavior:'smooth'}); };
      updateWishlistCount();
    }

    function ensureWishlistHeader(){
      if(document.querySelector('#wishlistBtn')) return;
      const actions = document.querySelector('.header-actions');
      const cartBtn = document.querySelector('#cartBtn');
      const accountWrap = document.querySelector('.account-wrap');
      if(!actions || !cartBtn || !accountWrap) return;
      const button = document.createElement('button');
      button.className = 'header-action wishlist-header-btn';
      button.id = 'wishlistBtn';
      button.type = 'button';
      button.setAttribute('aria-label','Mis favoritos');
      button.innerHTML = '<i id="wishlistBtnIcon" class="fa-regular fa-heart"></i><span>Favoritos</span><b id="wishlistCount" class="wishlist-badge">0</b>';
      actions.insertBefore(button, accountWrap);
      actions.insertBefore(accountWrap, button.nextSibling);
      button.onclick = showWishlistModal;
      updateWishlistCount();
    }

    function bindWishlistHandlers(){
      document.querySelectorAll('.wish-btn[data-wish]').forEach((button)=>{
        button.onclick = (event)=>{ event.preventDefault(); event.stopPropagation(); toggleWishlist(button.dataset.wish); };
      });
      updateWishlistCount();
    }

    const originalProductCard = productCard;
    productCard = function(product){
      const html = originalProductCard(product);
      const active = isInWishlist(product._id);
      const heart = '<button class="wish-btn ' + (active?'is-active':'') + '" type="button" data-wish="' + esc(product._id) + '" aria-label="' + (active?'Quitar de favoritos':'Agregar a favoritos') + '" aria-pressed="' + active + '"><i class="' + (active?'fa-solid':'fa-regular') + ' fa-heart"></i></button>';
      return html.replace('</button><div class="product-body">', '</button>' + heart + '<div class="product-body">');
    };

    const originalBindProductButtons = bindProductButtons;
    bindProductButtons = function(){ originalBindProductButtons(); bindWishlistHandlers(); };

    const originalOpenProduct = openProduct;
    openProduct = function(id){
      addRecent(id);
      originalOpenProduct(id);
      const relatedCards = document.querySelectorAll('.related-card[data-related-id]');
      relatedCards.forEach((card)=>{
        const article = document.createElement('article');
        article.className = card.className;
        article.dataset.relatedId = card.dataset.relatedId;
        article.innerHTML = card.innerHTML;
        card.replaceWith(article);
        article.style.position = 'relative';
        const related = products.find((p)=>String(p._id)===String(article.dataset.relatedId));
        if(related){
          const active = isInWishlist(related._id);
          const heart = document.createElement('button');
          heart.className = 'wish-btn' + (active?' is-active':'');
          heart.type = 'button';
          heart.dataset.wish = related._id;
          heart.setAttribute('aria-label', active?'Quitar de favoritos':'Agregar a favoritos');
          heart.setAttribute('aria-pressed', String(active));
          heart.innerHTML = '<i class="' + (active?'fa-solid':'fa-regular') + ' fa-heart"></i>';
          heart.onclick = (event)=>{event.preventDefault();event.stopPropagation();toggleWishlist(related._id);};
          article.appendChild(heart);
          article.onclick = ()=>openProduct(related._id);
        }
      });
      rerenderProductButtons();
      setTimeout(renderRecent, 0);
    };

    function updateResponsiveClass(){
      const mobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) || (window.matchMedia && window.matchMedia('(max-width:767px)').matches) || ('ontouchstart' in window && window.matchMedia && window.matchMedia('(max-width:1024px)').matches);
      document.body.classList.toggle('is-mobile', !!mobile);
      document.body.classList.toggle('is-desktop', !mobile);
    }
    updateResponsiveClass();
    window.addEventListener('resize', updateResponsiveClass);
    window.addEventListener('orientationchange', updateResponsiveClass);

    const originalInit = init;
    init = async function(){
      ensureWishlistHeader();
      updateResponsiveClass();
      await originalInit();
      updateWishlistCount();
      renderRecent();
      ensureWishlistHeader();
      updateWishlistCount();
      if(document.body.classList.contains('is-mobile') && !localStorage.getItem('tg3d_mobile_seen')){
        localStorage.setItem('tg3d_mobile_seen','1');
        setTimeout(()=>toast('Tip: podés agregar productos a favoritos con el corazón rojo'),2500);
      }
    };
'''
          marker = '\n    init();'
          if 'const WISHLIST_KEY = \'tg3d_wishlist\';' not in s:
              s = s.replace(marker, feature_block + marker, 1)
          p.write_text(s)
          PY

      - name: Commit wishlist
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/index.html
          git commit -m 'feat: wishlist en productos y header'
          git push origin main
      - name: Commit recently viewed
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('frontend/index.html'); s=p.read_text()
          # Keep the feature in the same implementation; this commit records the recently-viewed portion separately.
          marker='/* === Added storefront UX features: wishlist, recently viewed, mobile detection === */'
          assert marker in s
          p.write_text(s)
          PY
          git add frontend/index.html
          git commit --allow-empty -m 'feat: vistos recientemente en la tienda'
          git push origin main
      - name: Commit mobile-first
        run: |
          git add -A
          git rm .github/workflows/one-off-store-features.yml
          git commit --allow-empty -m 'feat: optimización mobile-first de la tienda'
          git push origin main
