name: one-off-store-features
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-off-store-features.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply storefront features
        run: python3 scripts/patch_storefront_features.py
      - name: Commit and push feature
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/index.html
          git commit -m 'feat: wishlist en productos y header'
          git push origin main
